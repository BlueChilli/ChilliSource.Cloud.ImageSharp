trigger:
  branches:
    include:
    - develop
    - master

pool:
  vmImage: 'windows-2022'

steps:
- task: UseDotNet@2
  displayName: Use .NET 10 SDK
  inputs:
    packageType: sdk
    version: 10.x

- task: PowerShell@2
  inputs:
    filePath: 'build/build.ps1'
    # Debug until the Six Labors key validates: a Release build fails on a bad key, Debug only warns.
    arguments: '-Configuration Debug'
    workingDirectory: 'build'
  env:
    NUGET_APIKEY: $(NUGET_APIKEY)   # secret variables only reach scripts when mapped here